<title>비정상상황 | DopS</title>
<style>
:root{--bg:#F1F4F8;--ink:#3A4558;--sub:#7B879A;--line:#E2E8F0;--navy:#5B79A6;--sky:#EAF0F8;--sky2:#DDE6F2;--teal:#2BA99F;--teal2:#1E8C83;--tealbg:#E6F5F3;--purple:#6B4FA0;--purplebg:#F1ECFA;--orange:#C57C00;--orangebg:#FEF6E0;--red:#D94040;--redbg:#FDF0F0;--green:#1A9E75;--greenbg:#E8F7F1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Spoqa Han Sans Neo","Spoqa Han Sans",Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px}
#app{max-width:1400px;margin:0 auto;padding-bottom:90px}
.top{background:linear-gradient(135deg,#6C89B4,#8AA3C6);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:18px}.top small{display:block;opacity:.85;font-size:12px;margin-top:1px}
.pill{background:rgba(255,255,255,.18);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.stp{display:flex;gap:4px;margin:8px 10px 0}.stp div{flex:1;text-align:center;padding:9px 2px;border-radius:9px;background:#E8EDF3;color:#5E6B80;font-size:12px;font-weight:700;letter-spacing:-.3px;cursor:pointer;white-space:nowrap}.stp .on{background:#1F6FEB;color:#fff;font-weight:800}.stp .dn{background:#D6F0DD;color:#1A7F37}
.nxt{margin:8px 10px 0;background:#FFF4E0;border:1px solid #F0B34A;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer}.nxt b{color:#B45309}.nxt small{display:block;font-weight:600;color:#7B6A4A;font-size:12px;margin-top:2px}.nxt i{font-style:normal;background:#F59E0B;color:#fff;border-radius:14px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}.nxt.ok{background:#E6F5F3;border-color:#9AD6CF}.nxt.ok i{background:#2BA99F}
.rfr{margin:4px 12px 0;text-align:right;font-size:11px;color:#7B879A;cursor:pointer}

.fmg{display:flex;align-items:center;gap:14px;margin-top:10px;padding:8px 10px;background:#F1ECFA;border-radius:9px;font-size:13px;font-weight:700;color:#5E6B80}.fmg b{color:var(--purple)}.fmg i{font-style:normal;font-weight:800;color:#2A3547;font-size:16px}.bdx .fmg{background:transparent;border-top:2px solid var(--ln);border-radius:0;font-size:min(1.4vw,2.6vh);margin-top:.6vh;padding:.6vh 0 0}.bdx .fmg i{font-size:min(1.9vw,3.6vh)}
.ghost.cp{background:#EAF3FF;border-color:#9CC4FF;color:#1F6FEB}
.tabs5{display:flex;background:#fff;margin:12px 10px 0;border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
.tabs5 div{flex:1 1 0;min-width:0;text-align:center;padding:9px 2px;font-weight:700;font-size:12px;letter-spacing:-.3px;white-space:nowrap;color:#5E6B80;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px}
.tabs5 .on{background:var(--navy);color:#fff}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 12px 0;box-shadow:0 2px 8px rgba(0,0,0,.07);border:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:17px;font-weight:800;color:#2A3547;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:12px 0 6px;font-size:14px;color:var(--sub);font-weight:700}
.date{display:flex;gap:8px;align-items:center}
.date .n{width:46px;height:46px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:20px;color:var(--navy);font-weight:800;cursor:pointer}
.date .d{flex:1;height:46px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--navy);position:relative}
.date .d input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.date .t{height:46px;padding:0 14px;border-radius:10px;border:1.5px solid #9FB8E0;display:grid;place-items:center;font-weight:800;color:var(--navy);cursor:pointer}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns div,.btns button{padding:12px 16px;border-radius:10px;font-weight:800;font-size:14.5px;cursor:pointer;border:0;font-family:inherit}
.b1{border:1.5px solid #BFE6E2!important;color:var(--teal2);background:#fff}.b2{background:var(--navy);color:#fff}.b3{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}.b0{background:#EEF1F6;color:#7B879A}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 15px;border-radius:20px;background:#F7F9FC;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:#5E6B80;cursor:pointer}
.chip.on{background:var(--tealbg);border-color:var(--teal);color:var(--teal2)}.chip.dis{opacity:.4;pointer-events:none}.chip.dn{background:#DDF3E6;border-color:#4CB07A;color:#1E7A48}.chip.dn.on{background:#BFE8CF;border-color:#12683B;color:#12683B;box-shadow:0 0 0 2px #12683B33}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kp.k3{grid-template-columns:repeat(3,1fr)}.kp.k7{grid-template-columns:repeat(4,1fr)}
.kp>div{border-radius:10px;padding:12px 4px 10px;text-align:center;background:#fff;border:1px solid var(--line)}
.kp b{display:block;font-size:28px;line-height:1.15;font-weight:800}.kp span{font-size:13px;font-weight:700}.kp small{display:block;font-size:12px;opacity:.8}
.k1{color:#5B79A6}.k2{color:var(--teal)}.k3c{color:var(--purple)}.k4{color:var(--orange)}.k5{color:var(--red)}.k6{color:var(--green)}.k7c{color:#44546F}
.k1 span,.k2 span,.k3c span,.k4 span,.k5 span,.k6 span,.k7c span{color:#5E6B80}
.flip{background:linear-gradient(135deg,#6C89B4,#8AA3C6);border-radius:14px;padding:16px;margin:12px 12px 0;color:#fff}
.flip .lb{display:flex;justify-content:space-between;font-size:13.5px;opacity:.95;align-items:center;gap:8px}
.flip select{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;padding:4px 8px;font-weight:700;font-family:inherit}
.flip select option{color:#333}
.dg{display:flex;gap:6px;align-items:flex-end;margin-top:8px}.dg i{font-style:normal;width:56px;height:76px;border-radius:12px;background:#58739F;display:grid;place-items:center;font-size:52px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(255,255,255,.1)}
.dg span{font-size:20px;margin-left:4px;opacity:.85;padding-bottom:8px}.dg .q{margin-left:auto;text-align:right;font-size:13px;opacity:.95;line-height:1.5}.dg .q b{font-size:22px;display:block}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.gauge{display:flex;align-items:center;gap:14px}.gauge svg{flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12.5px;color:var(--sub);font-weight:700;text-align:right;padding:7px 3px;border-bottom:1.5px solid var(--line)}
td{text-align:right;padding:9px 3px;border-bottom:1px solid #EAEFF6;font-weight:700}th:first-child,td:first-child{text-align:left;font-weight:800}tr.sum td{background:#EDF2F8;font-weight:800}
.bad{color:var(--red)}.good{color:var(--green)}.dim{color:#A0ACC0;font-weight:600}
.un td:first-child i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bx{border-radius:10px;border:1.5px solid var(--line);padding:11px;margin-top:9px}.bx .hd{display:flex;justify-content:space-between;font-weight:800;font-size:15px}.bx .hd span{font-size:13px}
.fl{display:grid;grid-template-columns:34px repeat(3,1fr);gap:5px;margin-top:6px;align-items:center}.fl em{font-style:normal;font-weight:800;font-size:13px;color:var(--sub)}
.fl div{border-radius:10px;text-align:center;padding:7px 0;font-weight:800;font-size:15px;background:#F3F6FB}.fl div.l{background:var(--redbg);color:var(--red)}.fl div.o{background:var(--greenbg);color:var(--green)}.fl div.z{color:#B3BDCE;font-weight:600}
.fl small{display:block;font-size:10px;font-weight:700;opacity:.8}
.fh{display:grid;grid-template-columns:34px repeat(3,1fr);gap:5px;font-size:11.5px;color:var(--sub);font-weight:700;text-align:center;margin-top:8px}
.fl.cl div{cursor:pointer}.fl.cl div.pk{background:var(--navy);color:#fff}
.sp4{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-top:6px}.sp4 div{border-radius:10px;text-align:center;padding:8px 2px;font-weight:800;font-size:14px;background:#F3F6FB}.sp4 div small{display:block;font-size:10.5px;color:var(--sub)}
.sp4 div.l{background:var(--redbg);color:var(--red)}.sp4 div.pk{background:var(--navy);color:#fff}.sp4 div.pk small{color:#DCE6F4}
.step{display:flex;gap:10px;align-items:center;margin:14px 0 6px}.step i{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;flex-shrink:0}.step b{font-size:15.5px}
.names{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.nm{border:1px solid #E4E8EF;border-left:4px solid #D5DBE6;border-radius:12px;padding:3px 1px;min-height:40px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#fff;color:#2B3345;font-weight:700;font-size:15px;position:relative;overflow:hidden;cursor:pointer;line-height:1.25;word-break:keep-all;box-shadow:0 1px 2px rgba(30,45,70,.07)}
.nm small{display:block;font-size:10.5px;font-weight:700;margin-top:0;color:#8A93A5;white-space:nowrap;letter-spacing:-.4px;line-height:1.2}
.nm small:empty{display:none}
.nm.gM{border-left-color:#6C9EF2}.nm.gF{border-left-color:#E872A8}
.nm.pk{background:#E1F7F3;box-shadow:inset 0 0 0 2px #0FA897}.nm.pk small{color:#08796C}
.nm.dn small{color:#08877A;font-weight:800}
.nm.pd{border-top-style:dashed;border-right-style:dashed;border-bottom-style:dashed;border-top-color:#0FA897;border-right-color:#0FA897;border-bottom-color:#0FA897}.nm.pd small{color:#08877A;font-weight:800}
.nm.lv{background:#fff;color:#9AA3B2;cursor:default}.nm.lv small{color:#E8590C}
.nm.sp{border-top-color:#CFC2EA;border-right-color:#CFC2EA;border-bottom-color:#CFC2EA}.nm.sp small{color:#6A3DD8;font-weight:800}
.nm.xp{border-top-color:#F4D7A6;border-right-color:#F4D7A6;border-bottom-color:#F4D7A6;border-left-color:#F0B35A}.nm.xp small{color:#D9730D}
.u{position:absolute;top:0;right:0;width:11px;height:11px;clip-path:polygon(0 0,100% 0,100% 100%)}.um{background:#D9566B}.uh{background:#6F8FC2}.ub{background:#A3AFC4}
.gm{color:#5E86E8}.gf{color:#E0678A}
.grp{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:14px 0 8px}.grp span{font-size:12.5px;color:var(--sub);font-weight:700}.grp.done{padding-top:12px;border-top:2px dashed var(--line)}
.gs{display:flex;gap:8px;margin-top:10px}.gs div{flex:1;border-radius:10px;padding:9px 4px;text-align:center;font-weight:800;font-size:13px}
.sel{min-height:50px;border-radius:10px;border:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:15px;background:#fff;color:#34445F;font-weight:600;cursor:pointer}
.ghost{display:inline-flex;gap:8px;align-items:center;margin-top:10px;padding:12px 16px;border-radius:10px;background:var(--sky);color:#4F6B99;font-weight:800;font-size:15px;cursor:pointer}.ghost.on{background:var(--tealbg);color:var(--teal2);box-shadow:inset 0 0 0 1.5px var(--teal)}
.diff{display:grid;grid-template-columns:1fr 34px 1fr;gap:6px;align-items:center;margin-top:8px}.diff .b{border-radius:10px;padding:11px;text-align:center}.diff .o{background:var(--orangebg);color:var(--orange)}.diff .i{background:var(--purplebg);color:var(--purple)}.diff b{font-size:24px;display:block}.diff span{font-size:12.5px;font-weight:700}.diff i{text-align:center;font-style:normal;font-size:20px;color:var(--sub)}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700;color:var(--green);margin-top:6px}.chk.x{color:var(--red)}
.alert{display:flex;gap:12px;align-items:center;background:var(--redbg);border:1.5px solid #F6C7CF;border-radius:10px;padding:13px;margin-top:12px}.alert b{color:var(--red)}
.info{background:#EAF0F8;border:1.5px solid #C5DBFA;border-radius:10px;padding:13px;margin-top:12px;font-size:14px;line-height:1.5}
.note{font-size:12.5px;color:var(--sub);margin:10px 0 0;line-height:1.5}
.rl{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;background:#fff}.rl .t{flex:1}.rl .t b{font-size:16px;display:block}.rl .t small{color:var(--sub);font-weight:700;font-size:12.5px}
.rl .c{text-align:center;font-size:11.5px;color:var(--sub);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.tg{width:52px;height:30px;border-radius:16px;background:#CBD5E4;position:relative;flex:none;cursor:pointer}.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.15s}.tg.on{background:var(--teal)}.tg.on:after{left:25px}
.seg3{display:flex;gap:6px;background:#fff;margin:12px 12px 0;padding:5px;border-radius:10px;border:1px solid var(--line)}.seg3 div{flex:1;text-align:center;padding:10px 2px;font-weight:800;font-size:13px;white-space:nowrap;color:#5E6B80;border-radius:8px;cursor:pointer}.seg3 .on{background:var(--sky);color:var(--navy);box-shadow:inset 0 -2px 0 var(--teal)}
.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:30;max-width:1400px;margin:0 auto}
.bot button{flex:1;border:0;border-radius:10px;padding:14px 6px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer}.bot button:disabled{opacity:.4}
.sheetbg{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}.sheet h3{margin:0 0 10px;font-size:17px;color:#2A3547}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:16px}}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#2A3547;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;z-index:99;display:none;max-width:90%}
.empty{padding:40px 16px;text-align:center;color:var(--sub);font-weight:700;line-height:1.7}
.ld{padding:60px;text-align:center;color:var(--sub);font-weight:700}
.stg{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:800}
.pcg{display:block}
@media(min-width:1000px){.pcg{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start}.pcg>.col{min-width:0}.pcg .card,.pcg .flip{margin-left:8px;margin-right:8px}.names{grid-template-columns:repeat(8,1fr)}}
.wide{margin:12px 12px 0}


.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st3>div{border-radius:12px;padding:12px 4px;text-align:center;border:1.5px solid var(--line);background:#fff}.st3 b{display:block;font-size:30px;line-height:1.1;font-weight:800}.st3 span{font-size:13px;font-weight:800;color:#5E6B80}
.cl{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:#fff}.cl .h{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}.cl .h small{color:var(--sub);font-weight:700;font-size:12.5px}.cl .m{font-size:13.5px;color:#5E6B80;font-weight:700;margin-top:4px}.cl.dn{background:#F4F6FA}

.bdx{--k1:#1F3A6E;--k2:#3F6FC4;--k3:#4FB3C8;--k4:#A5B1C6;--bg:#EDF1F6;--cd:#fff;--tl:#F4F6FA;--ink:#1B2A44;--sub:#6B7A93;--ln:#E1E7F0;--blue:#3F6FC4;--amb:#D98A1F;--red:#D9483B;--grn:#2A9D6B;--rg:#E3E9F2;position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);overflow:auto;padding:clamp(10px,1.2vw,22px);display:flex;flex-direction:column;gap:clamp(8px,1vw,16px);font-family:inherit}

  }catch(e){toast('저장 실패: '+e.message);}
}
async function ckReopen(){var t=S.ck.team,L=S.ck.grp.replace('조','');var ok=await ask('마감 되돌리기',t+' '+L+'조 출근 체크 마감을 되돌릴까요?','되돌리기');if(!ok)return;
  try{await rpc('ab_close_team',{p_date:S.date,p_team:t,p_grp:L,p_closed:false});await loadAll(true);}catch(e){toast('실패: '+e.message);}}
// 팀 지원
function supFrom(t,L){var sp=S.sp;if(t){sp.fromTeam=t;sp.fromGrp=['A','B','C'].filter(function(x){return S.grp[t+x]&&S.grp[t+x].roster.length;})[0]||'A';}if(L)sp.fromGrp=L;sp.sel={};render();}
function supTo(t,L){var sp=S.sp;if(t){sp.toTeam=t;sp.toGrp=['A','B','C'].filter(function(x){return S.grp[t+x];})[0]||'';}if(L)sp.toGrp=L;render();}
function supZone(){openZoneSheet(S.sp.zone,function(k){S.sp.zone=k;render();});}
function supTog(id){if(S.sp.sel[id])delete S.sp.sel[id];else S.sp.sel[id]=1;render();}
async function supSave(){var sp=S.sp,ids=Object.keys(sp.sel),from=sp.fromTeam+sp.fromGrp,to=sp.toTeam+sp.toGrp;
  if(from===to){toast('보내는 조와 받는 조가 같습니다');return;}
  var ok=await ask('팀 지원 저장',from+' → '+to+' · '+zoneLabel(sp.zone)+' · '+ids.length+'명','저장');if(!ok)return;
  try{var r=await rpc('ab_save_support',{p_date:S.date,p_from_team:from,p_to_team:to,p_zone_key:sp.zone,p_emps:ids});sp.sel={};toast('지원 '+(r&&r.moved||ids.length)+'명 저장');await loadAll(true);}catch(e){toast('저장 실패: '+e.message);}}
async function supCancel(id){var ok=await ask('지원 취소','이 지원을 취소하면 출근 체크와 구역 배치도 함께 취소됩니다.','지원 취소');if(!ok)return;
  try{await rpc('ab_cancel_support',{p_date:S.date,p_emp:id});toast('취소했습니다');await loadAll(true);}catch(e){toast('실패: '+e.message);}}

// ── 노조 명단 업로드 (최고관리자) ──
function openUnion(){if(!isMaster())return;S.view='union';S.upl=null;loadUplLog();render();}
function closeSub(){S.view='main';render();}
async function loadUplLog(){try{S.uplLog=await getJ('/ab_union_log?select=file_name,row_count,matched,uploaded_by,uploaded_at&order=uploaded_at.desc&limit=8');}catch(e){S.uplLog=[];}if(S.view==='union')render();}
function normUnion(v){var s=String(v==null?'':v).replace(/\s/g,'');if(!s)return '';if(/민노|민주|KCTU/i.test(s))return '민노';if(/한마음|한노|한국노총|FKTU/i.test(s))return '한마음';if(/비노조|비조합|무소속|미가입|없음|^비$/.test(s))return '비노조';if(/^민/.test(s))return '민노';if(/^한/.test(s))return '한마음';if(/^비/.test(s))return '비노조';return '';}
function unionView(){
  var u=S.upl,h='<div class="card"><h2>노조 명단 올리기</h2><div class="info" style="margin-top:0">엑셀 파일에 <b>사번</b>과 <b>노조</b>(민노 / 한마음 / 비노조) 열이 있으면 됩니다. 올리기 전에 먼저 검사 결과를 보여 드립니다. 저장하면 기존 명단이 새 명단으로 교체됩니다.</div>'
   +'<div class="btns"><label class="b2" style="padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer">엑셀 파일 선택<input type="file" accept=".xlsx,.xls,.csv" onchange="uplFile(this.files[0])"></label><div class="b0" onclick="closeSub()">돌아가기</div></div>';
  if(u){h+='<h3>'+esc(u.name)+' 검사 결과</h3><div class="kp"><div class="k1"><b>'+u.rows+'</b><span>읽은 행</span></div><div class="k6"><b>'+u.ok+'</b><span>연결 성공</span></div><div class="k5"><b>'+u.fail+'</b><span>연결 실패</span></div><div class="k4"><b>'+u.dup+'</b><span>중복</span></div></div>'
    +'<table class="un" style="margin-top:10px"><tr><th>구분<th>인원</tr>'+['민노','한마음','비노조'].map(function(k){return '<tr><td>'+k+'<td>'+(u.cnt[k]||0);}).join('')+'</table>'
    +(u.unk?'<p class="note bad">노조 이름을 읽지 못한 행 '+u.unk+'개는 제외됩니다 (민노 / 한마음 / 비노조만 인식)</p>':'')
    +(u.failList.length?'<h3>연결 실패 사번 (DopS에 없는 사번)</h3><div class="note" style="color:var(--red);font-weight:700">'+u.failList.slice(0,40).map(esc).join(', ')+(u.failList.length>40?' 외 '+(u.failList.length-40)+'개':'')+'</div>':'')
    +'<div class="btns"><div class="b3" onclick="uplSave()">'+u.ok+'명 저장 (기존 명단 교체)</div></div>';}
  h+='<h3>올린 기록</h3>'+((S.uplLog&&S.uplLog.length)?'<table><tr><th>파일<th>읽음<th>연결<th>올린 사람</tr>'+S.uplLog.map(function(x){return '<tr><td style="font-weight:600">'+esc(x.file_name||'')+'<br><span class="dim" style="font-size:11.5px">'+esc(String(x.uploaded_at).slice(0,16).replace('T',' '))+'</span><td>'+x.row_count+'<td>'+x.matched+'<td style="font-weight:600">'+esc(x.uploaded_by||'');}).join('')+'</table>':'<div class="dim">아직 올린 기록이 없습니다</div>');
  return h+'</div>';
}
function uplFile(f){if(!f)return;var rd=new FileReader();rd.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    var hi=-1,ci=-1,ui=-1;for(var i=0;i<Math.min(a.length,15)&&hi<0;i++){a[i].forEach(function(c,j){var s=String(c).replace(/\s/g,'');if(ci<0&&/사번|사원번호/.test(s))ci=j;});if(ci>=0){hi=i;a[i].forEach(function(c,j){var s=String(c).replace(/\s/g,'');if(ui<0&&/노조|조합|소속|구분/.test(s)&&j!==ci)ui=j;});}}
    if(hi<0||ui<0){toast('사번·노조 열을 찾지 못했습니다');return;}
    var seen={},rows=[],dup=0,unk=0,okN=0,failList=[],cnt={},total=0;
    for(var r=hi+1;r<a.length;r++){var no=String(a[r][ci]).trim().replace(/\.0$/,'');if(!no)continue;total++;var un=normUnion(a[r][ui]);if(!un){unk++;continue;}if(seen[no]){dup++;continue;}seen[no]=1;rows.push({emp_no:no,union_name:un});if(S.byNo[no]){okN++;cnt[un]=(cnt[un]||0)+1;}else failList.push(no);}
    S.upl={name:f.name,rows:total,ok:okN,fail:failList.length,dup:dup,unk:unk,cnt:cnt,failList:failList,data:rows};render();
  }catch(e){toast('파일을 읽지 못했습니다: '+e.message);}};rd.readAsArrayBuffer(f);}
async function uplSave(){var u=S.upl;if(!u)return;var ok=await ask('노조 명단 저장','기존 명단이 지워지고 새 명단 '+u.ok+'명으로 교체됩니다.','저장');if(!ok)return;
  try{var r=await rpc('ab_import_union',{p_rows:u.data,p_file:u.name});toast('저장 완료 · 연결 '+(r&&r.matched)+'명');S.upl=null;await loadAll(true);S.view='union';await loadUplLog();render();}catch(e){toast('저장 실패: '+e.message);}}

// ── 관리 (접근 권한, 최고관리자) ──
var ROLES=[['admin','관리자'],['manager','팀장'],['leader','조장'],['acting_leader','조장 대행']];
async function openManage(){if(!isMaster())return;S.view='manage';try{var r=await getJ('/ab_settings?select=value&key=eq.access');S.manage=JSON.parse(JSON.stringify((r[0]&&r[0].value)||{roles:{}}));}catch(e){S.manage={roles:{}};toast('설정을 불러오지 못했습니다');}
  ROLES.forEach(function(x){S.manage.roles=S.manage.roles||{};S.manage.roles[x[0]]=S.manage.roles[x[0]]||{open:false,union:false};});render();}
function manageView(){var m=S.manage;
  var h='<div class="card"><h2>접근 권한 관리</h2><div class="info" style="margin-top:0">최고관리자는 항상 볼 수 있습니다. 아래에서 켠 직급만 비정상상황 화면을 열 수 있고, <b>노조 표시</b>를 따로 켠 직급만 노조 정보(삼각형·참여 현황)를 봅니다.</div><div class="btns"><div class="b2" onclick="mgAll(true)">전체 켜기</div><div class="b0" onclick="mgAll(false)">전체 끄기</div></div><div style="margin-top:14px">';
  ROLES.forEach(function(r){var c=m.roles[r[0]];h+='<div class="rl"><div class="t"><b>'+r[1]+'</b><small>'+(r[0]==='admin'?'모든 팀 편집':'본인 팀만 편집')+'</small></div><div class="c">화면 열기<div class="tg'+(c.open?' on':'')+'" onclick="mgTog(\''+r[0]+'\',\'open\')"></div></div><div class="c">노조 표시<div class="tg'+(c.union?' on':'')+'" onclick="mgTog(\''+r[0]+'\',\'union\')"></div></div></div>';});
  return h+'</div><div class="btns"><div class="b3" onclick="mgSave()">저장</div><div class="b0" onclick="closeSub()">돌아가기</div></div></div>';}
function mgTog(r,k){var c=S.manage.roles[r];c[k]=!c[k];if(k==='union'&&c.union)c.open=true;if(k==='open'&&!c.open)c.union=false;render();}
function mgAll(on){ROLES.forEach(function(r){var c=S.manage.roles[r[0]];c.open=on;if(!on)c.union=false;});render();}
async function mgSave(){try{await rpc('ab_set_access',{p_value:S.manage});toast('저장했습니다');await loadAll(true);S.view='manage';render();}catch(e){toast('저장 실패: '+e.message);}}

// ── 성별 설정 ──
function openGender(){S.view='gender';render();}
function genderView(){var t=S.ck.team,ed=teamEditable(t),h='<div class="card"><h2>'+esc(t)+' 성별 설정</h2><div class="info" style="margin-top:0">성별은 DopS 작업일지와 같은 값을 사용합니다. 비어 있는 사람만 먼저 보여 드립니다.</div><div class="btns"><div class="b0" onclick="closeSub()">돌아가기</div></div>';
  var rows=S.emps.filter(function(e){return e.team===t;}).sort(function(a,b){return (a.group_name||'').localeCompare(b.group_name||'')||String(a.name).localeCompare(String(b.name),'ko');});
  var miss=rows.filter(function(e){return !S.gender[e.emp_no];});
  h+='<h3>성별 미설정 '+miss.length+'명</h3>';
  (miss.length?miss:[]).forEach(function(e){h+=gRow(e,ed);});
  if(!miss.length)h+='<div class="dim">모두 설정되어 있습니다</div>';
  h+='<h3>설정됨 '+(rows.length-miss.length)+'명</h3>';rows.filter(function(e){return S.gender[e.emp_no];}).forEach(function(e){h+=gRow(e,ed);});
  return h+'</div>';}
function gRow(e,ed){var g=S.gender[e.emp_no];return '<div class="rl"><div class="t"><b>'+esc(e.name)+'</b><small>'+esc(e.group_name||'관리자')+' · '+esc(e.emp_no)+'</small></div><div class="chips"><span class="chip'+(g==='남'?' on':'')+(ed?'':' dis')+'" onclick="setGender(\''+esc(e.emp_no)+'\',\'남\')">남</span><span class="chip'+(g==='여'?' on':'')+(ed?'':' dis')+'" onclick="setGender(\''+esc(e.emp_no)+'\',\'여\')">여</span></div></div>';}
async function setGender(id,g){try{var r=await sbFetch('/worklog_emp_ext?on_conflict=emp_no',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:[{emp_no:id,gender:g,updated_by:(S.me&&S.me.name)||''}]});if(!r.ok){var j=await r.json();throw new Error(j.message||'저장 실패');}S.gender[id]=g;render();}catch(e){toast('저장 실패: '+e.message);}}

// ── 시작 ──
(function(){if(/[?&]coop=/.test(location.search)){pubInit();return;}S.me=loadMe();if(!S.me){location.href='index.html';return;}
  var wasPC=isPC();window.addEventListener('resize',function(){if(RP.open||CP.on)fitA4();var p=isPC();if(p!==wasPC){wasPC=p;if(!S.loading)render();}});
  loadAll();})();
</script></body></html>
