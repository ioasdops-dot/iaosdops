<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="group.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="그룹현황">
<title>그룹 통합 현황</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#2B2F36;--mut:#7A8190;--line:#E3E6EB;--soft:#EDEFF2;--sig:#FFE79A;--up:#E2705F;--dn:#2FA67C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 max(24px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 0 0}
.hd .bn{display:flex;align-items:center;gap:10px}
.hd .bn img{width:38px;height:38px;border-radius:50%;box-shadow:0 1px 6px #2b2f3630;flex:none}
.hd h1{font-size:16px;margin:0;font-weight:800}
.hd small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#3da57f;background:#E3F6EE;padding:5px 10px;border-radius:99px;font-weight:700;border:0}
.live i{width:7px;height:7px;border-radius:50%;background:#4BC79B}
.tabs{display:flex;gap:4px;margin:14px 0 0;background:#E6E8EC;border-radius:12px;padding:4px;position:sticky;top:0;z-index:5}
.tabs button{flex:1;padding:9px 0;font-size:13px;color:var(--mut);border:0;background:none;border-radius:9px;font-weight:600}
.tabs button.on{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 4px #2b2f361a}
.pane{display:none;padding-top:12px}.pane.on{display:block}
.card{background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line)}
.card h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.card h3 small{font-weight:500;color:var(--mut);font-size:11px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 0;line-height:1.5}
/* 전광판 */
.board{background:linear-gradient(135deg,#FFF6D2,#FFEFB8);border-radius:18px;padding:13px 14px;margin-bottom:10px;border:1px solid #F5E2A0}
.board .lb{font-size:12px;color:#8a7430;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:700}
.flap{display:flex;gap:6px;align-items:flex-end}
.d{width:50px;height:70px;border-radius:10px;background:linear-gradient(#fffdf2 0 50%,#fff8da 50% 100%);position:relative;display:flex;align-items:center;justify-content:center;font:800 50px/1 ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:#5a4a12;box-shadow:0 2px 0 #e8d68a}
.d:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#f0dfa0}
.unit{font-size:15px;color:#8a7430;margin-left:4px;padding-bottom:6px;font-weight:700}
.share{margin-top:12px;height:14px;border-radius:8px;overflow:hidden;display:flex;gap:2px;background:#fff6}
.share i{display:block;height:100%}
.shl{display:flex;justify-content:space-between;font-size:11px;color:#8a7430;margin-top:5px;font-weight:700;gap:6px}
/* 사업부 비교 */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.cl{border-radius:16px;padding:10px 6px 9px;text-align:center}
.cl .nm{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.cl .nm i{width:8px;height:8px;border-radius:50%;flex:none}
.ring{width:84px;height:84px;margin:6px auto 4px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ring .c span{font-size:10px;color:var(--mut);margin-top:-2px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px}
.mini div{background:#ffffffaa;border-radius:8px;padding:4px 0;font-size:10px;color:var(--mut)}
.mini b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.top{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:#fff;color:#8a6a1f}
/* 근무조별 */
.gc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;height:140px;margin-top:8px}
.gcol{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.gcol div{width:24px;min-height:3px;border-radius:7px 7px 3px 3px;position:relative}
.gcol div b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:12px;font-weight:700;margin-top:6px}
.lg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px;font-weight:600}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* 현황판 */
.dp{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dp .nv{display:flex;align-items:center;gap:4px}
.dp .nv button{border:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-weight:800;color:var(--mut)}
.dp .nv b{min-width:84px;text-align:center;font-size:13px}
.dp .md{display:flex;background:#E6E8EC;border-radius:99px;padding:2px}
.dp .md button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mut)}
.dp .md button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #2b2f3620}
.kg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.kg div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center}
.kg small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;line-height:1.3;min-height:27px}
.kg b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kg b i{font-style:normal;font-size:11px;color:var(--mut);font-weight:600;margin-left:1px}
.kg .ok b{color:#2FA67C}.kg .wn b{color:#C98A1B}.kg .dg b{color:#D2503F}
.dc{display:block;text-decoration:none;color:inherit;border-radius:16px;padding:11px 12px;margin-bottom:8px}
.dc .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.dc .t span{font-size:11px;color:var(--mut);font-weight:700}
.dc .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.dc .big i{font-style:normal;font-size:12px;color:var(--mut);margin-left:2px}
.dc .big em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700;margin-left:8px}
.dc .m6{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dc .m6 div{background:#ffffffb8;border-radius:9px;padding:4px 0;text-align:center;font-size:10px;color:var(--mut);font-weight:700}
.dc .m6 b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.gl2{padding:5px 0;font-size:13px;display:flex;gap:8px;align-items:center}
.gl2 i{width:9px;height:9px;border-radius:50%;flex:none}
.dl{width:100%;margin-top:6px;padding:11px;border-radius:13px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px}
.hb{display:grid;grid-template-columns:60px 1fr 28px;gap:8px;align-items:center;font-size:12px;margin:6px 0;color:var(--mut);font-weight:700}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .b{height:11px;background:var(--soft);border-radius:7px;overflow:hidden}.hb .b i{display:block;height:100%;border-radius:7px;min-width:2px}
.hb em{font-style:normal;text-align:right;color:var(--ink);font-weight:800}
/* 통계 */
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips button{padding:6px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--mut);font-weight:700}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.br{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:12px;margin:7px 0;color:var(--mut);font-weight:700}
.br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .b{height:14px;background:var(--soft);border-radius:8px;overflow:hidden}
.br .b i{display:block;height:100%;border-radius:8px;min-width:2px}
.br em{font-style:normal;text-align:right;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.br em s{text-decoration:none;font-weight:700;font-size:10px;margin-left:4px}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:#9AA0AB}
.gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.g{text-align:center}.g svg{width:100%;height:auto}
.g b{display:block;font-size:17px;margin-top:-22px;font-variant-numeric:tabular-nums;font-weight:800}
.g span{font-size:11px;color:var(--mut);font-weight:700}
.g small{display:block;font-size:10px;color:var(--mut)}
.sp{display:flex;align-items:flex-end;gap:3px;height:30px}.sp i{flex:1;border-radius:3px 3px 1px 1px;min-height:2px}
/* 리포트 */
.hero{background:linear-gradient(135deg,#E9EBEF,#DDE1E6);border-radius:20px;padding:16px;border:1px solid var(--line)}
.hero p{margin:0;font-size:12px;color:var(--mut);font-weight:600}
.hero h2{margin:6px 0 0;font-size:21px;line-height:1.4;letter-spacing:-.4px}
.hero mark{background:linear-gradient(transparent 55%,var(--sig) 55%);color:inherit;padding:0 2px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px}
.kp small{font-size:11px;color:var(--mut);font-weight:600}
.kp b{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:800}
.kp s{text-decoration:none;font-size:11px;font-weight:700}
.pt{display:flex;gap:10px;border-radius:16px;padding:11px 12px;margin-top:8px;font-size:12.5px;line-height:1.45;align-items:center}
.pt .ic{min-width:30px;height:30px;padding:0 6px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
.pt b{display:block;font-size:13px;margin-bottom:1px}
.ex{display:flex;gap:8px;margin-top:12px}
.ex button{flex:1;padding:11px;border-radius:13px;font-size:13px;font-weight:800;background:var(--ink);color:#fff;border:0}
.ex button+button{background:#fff;color:var(--ink);border:1px solid var(--line)}
.note{font-size:11px;color:#9AA0AB;text-align:center;margin-top:10px}
/* 로그인 */
#login{max-width:380px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 20px 20px}
#login .lg1{display:block;width:132px;height:132px;margin:0 auto 18px;border-radius:50%;box-shadow:0 6px 24px #2b2f3626}
#login h1{font-size:20px;margin:0 0 4px;text-align:center}
#login p{margin:0 0 20px;color:var(--mut);font-size:13px;text-align:center}
#login label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:12px 0 5px}
#login input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:#fff;color:var(--ink)}
#login button{width:100%;margin-top:18px;padding:14px;border-radius:13px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:15px}
#login .err{color:var(--up);font-size:13px;margin-top:12px;min-height:18px}
.hide{display:none!important}
.gobar{display:flex;gap:8px;margin:12px 0 0}.gobar a{flex:1;text-align:center;text-decoration:none;padding:11px 4px;border-radius:12px;font-size:13px;font-weight:800;color:#2b3a55;line-height:1.25}.gobar a small{display:block;font-size:10.5px;font-weight:600;opacity:.7}.gobar a.off{opacity:.45;pointer-events:none}
.sm{font-size:12px;color:var(--mut);background:none;border:0;padding:4px}
:focus-visible{outline:3px solid #6FA0EC;outline-offset:2px}
@media print{.tabs,.ex,.live,.chips,#logout{display:none!important}.pane{display:block!important}body{background:#fff}.card,.hero,.kp div,.pt{break-inside:avoid}}
@media (prefers-reduced-motion:no-preference){.gcol div,.share i,.br .b i{transition:all .5s ease}}
</style>
</head>

<script>
(function(){
'use strict';
var sb = null;
var PALETTE = ['#4DBDB2','#6FA0EC','#E3A04C','#B69AE8','#E58FA8','#7DC7D6'];      // 사업부 색 (파스텔)
var SOFT    = ['#DDF3F1','#E4EDFC','#FBEBD2','#EDE5FA','#FBE3EA','#DDF1F5'];
var SHIFTS  = ['오전','오후','야간'];
var divs = [];            // [{id,name,short,color,soft}]
var state = {tab:'now', month:null, kpi:1, repMode:'month'};
var cache = {};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n0(v){return Math.round(Number(v)||0).toLocaleString('ko-KR');}
function pad(n){return (n<10?'0':'')+n;}

/* ---------- 날짜 (한국 시간 기준) ---------- */
function kstParts(d){
  var f = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d||new Date());
  var o={}; f.forEach(function(p){o[p.type]=p.value;}); return {y:+o.y||+o.year,m:+o.month,d:+o.day,hh:o.hour==='24'?'00':o.hour,mm:o.minute};
}
function ymd(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function daysIn(y,m){return new Date(y,m,0).getDate();}
function today(){var p=kstParts();return {y:p.y,m:p.m,d:p.d};}
function monthRange(ym){
  var y=+ym.slice(0,4), m=+ym.slice(5,7), t=today(), cur=(t.y===y&&t.m===m);
  var toD = cur ? t.d : daysIn(y,m);
  var py=m===1?y-1:y, pm=m===1?12:m-1, pTo=Math.min(toD, daysIn(py,pm));
  return {from:ymd(y,m,1), to:ymd(y,m,toD), pFrom:ymd(py,pm,1), pTo:ymd(py,pm,pTo), label:y+'년 '+m+'월', span:(cur?('1일~'+toD+'일'):'')};
}
function yearRange(y){
  var t=today(), cur=(t.y===y), toM=cur?t.m:12, toD=cur?t.d:31;
  return {from:ymd(y,1,1), to:ymd(y,toM,toD), pFrom:ymd(y-1,1,1), pTo:ymd(y-1,toM,Math.min(toD,daysIn(y-1,toM))), label:y+'년', span:cur?('1월~'+toM+'월'):''};
}
function lastMonths(n){var t=today(),a=[],y=t.y,m=t.m;for(var i=0;i<n;i++){a.push(y+'-'+pad(m));m--;if(m===0){m=12;y--;}}return a;}

/* ---------- 데이터 ---------- */
function rpc(name,args){
  return sb.rpc(name,args||{}).then(function(r){ if(r.error) throw r.error; return r.data||[]; });
}
function loadDivisions(){
  return sb.from('divisions').select('id,name,sort_order,active').neq('id','ALL').eq('active',true).order('sort_order').then(function(r){
    if(r.error) throw r.error;
    divs = (r.data||[]).map(function(d,i){
      return {id:d.id,name:d.name,short:d.name.replace(/환경미화사업부$/,'').replace(/사업부$/,'')||d.id,color:PALETTE[i%PALETTE.length],soft:SOFT[i%SOFT.length]};
    });
  });
}
function renderGoBar(){
  var h='';
  divs.forEach(function(d){
    var ok=(state.role==='master'||state.role==='group_viewer'||d.id===state.myDiv);
    h+='<a class="'+(ok?'':'off')+'" style="background:'+d.soft+'" href="index.html?app=1&div='+encodeURIComponent(d.id)+'">'+d.short+'<small>'+(ok?'앱 열기 ›':'내 사업부 아님')+'</small></a>';
  });
  $('goBar').innerHTML=h;
}
function byDiv(rows,key){var o={};rows.forEach(function(r){(o[r.division_id]=o[r.division_id]||[]).push(r);});return o;}

/* ---------- 도형 ---------- */
function ringSvg(vals,color){
  var r=33,C=2*Math.PI*r,t=vals.reduce(function(a,b){return a+b;},0),off=0,op=[1,.68,.38];
  var s='<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="#ffffffb0" stroke-width="9"/>';
  if(t>0) vals.forEach(function(x,i){var len=Math.max(0,x/t*C-3);
    s+='<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+color+'" stroke-opacity="'+op[i]+'" stroke-width="9" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>'; off+=x/t*C;});
  return '<svg viewBox="0 0 84 84" aria-hidden="true">'+s+'</svg>';
}
function gaugeSvg(pct,color){
  var r=36,L=Math.PI*r,f=Math.max(0,Math.min(pct,100))/100*L;
  return '<svg viewBox="0 0 100 58" aria-hidden="true"><path d="M14 52 A36 36 0 0 1 86 52" fill="none" stroke="#E6E8EC" stroke-width="10" stroke-linecap="round"/><path d="M14 52 A36 36 0 0 1 86 52" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+f+' '+L+'"/></svg>';
}

   +'<div class="hero"><p>'+rg.label+(rg.span?' · '+rg.span:'')+'</p><h2>하루 평균 <mark>'+n0(hc)+'명</mark>이 근무했고, 안전사고는 <mark>'+n0(acc)+'건</mark>이에요</h2></div>'
   +'<div class="kp">'
   +'<div><small>인수인계</small><b>'+n0(ho)+'건</b>'+pctTxt(ho,sumMetric(sm,'handover','prev'),'handover')+'</div>'
   +'<div><small>민원</small><b>'+n0(voc)+'건</b>'+pctTxt(voc,sumMetric(sm,'voc','prev'),'voc')+'</div>'
   +'<div><small>폐기물</small><b>'+wasteTxt+'</b>'+pctTxt(waste,sumMetric(sm,'waste_kg','prev'),'waste_kg')+'</div>'
   +'<div><small>공동작업</small><b>'+n0(jp)+'명</b>'+pctTxt(jp,sumMetric(sm,'joint_people','prev'),'joint_people')+'</div></div>'
   +pts
   +'<div class="ex"><button type="button" id="pdfBtn">PDF로 저장</button><button type="button" id="imgBtn">이미지로 저장</button></div>'
   +'<div class="note">전기간 = '+(state.repMode==='year'?'작년 같은 기간':'지난달 같은 일수')+'</div>';
  $('pdfBtn').onclick=function(){window.print();};
  $('imgBtn').onclick=saveImage;
}
function saveImage(){
  function go(){
    window.html2canvas(el$('p-rep'),{backgroundColor:'#F4F7FD',scale:2}).then(function(c){
      var a=document.createElement('a');a.download='그룹현황_'+state.month+'.png';a.href=c.toDataURL('image/png');a.click();});
  }
  function el$(i){return document.getElementById(i);}
  if(window.html2canvas) return go();
  var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=go;
  s.onerror=function(){alert('이미지 저장 도구를 불러오지 못했어요. PDF로 저장을 사용해 주세요.');};document.head.appendChild(s);
}

/* ---------- 로딩 ---------- */
function stamp(){var p=kstParts();$('stamp').textContent='오늘 '+p.m+'/'+p.d+' '+p.hh+':'+p.mm+' 기준';}
function loadNow(){var rg=dashRange();return rpc('group_dashboard',{p_from:rg.from,p_to:rg.to}).then(renderNow);}
function loadStats(){
  var rg=state.repMode==='year'&&state.tab==='rep'?yearRange(+state.month.slice(0,4)):monthRange(state.month);
  var yr=+state.month.slice(0,4), key=state.tab+'|'+state.month+'|'+state.repMode;
  return Promise.all([
    rpc('group_stats',{p_from:rg.from,p_to:rg.to,p_prev_from:rg.pFrom,p_prev_to:rg.pTo}),
    rpc('group_kpi',{p_year:yr}), rpc('group_kpi_targets',{p_year:yr}), rpc('group_daily_intake',{p_days:7})
  ]).then(function(r){
    var data={stats:r[0],kpi:r[1].map(function(x){x.month=+x.month;return x;}),kpiT:r[2].map(function(x){x.idx=+x.idx;return x;}),intake:r[3]};
    if(state.tab==='stat') renderStat(data); else renderRep(data);
  });
}
function load(){
  stamp();
  var p = state.tab==='now' ? loadNow() : loadStats();
  return p.catch(function(e){
    var msg=(e&&e.message)||'알 수 없는 오류';
    $('p-'+state.tab).innerHTML='<div class="card empty">데이터를 불러오지 못했어요.<br>'+esc(msg)+'<br>잠시 후 새로고침을 눌러 주세요.</div>';
  });
}
function showTab(t){
  state.tab=t;
  document.querySelectorAll('.tabs button').forEach(function(b){var on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
  ['now','stat','rep'].forEach(function(k){$('p-'+k).classList.toggle('on',k===t);});
  load();
}

/* ---------- 로그인 / 권한 ---------- */
function toEmail(id){id=String(id||'').trim();return id.indexOf('@')>=0?id:id+'@iaosdops.internal';}
function showLogin(msg){$('app').classList.add('hide');$('login').classList.remove('hide');$('loginErr').textContent=msg||'';}
function enter(){
  return sb.auth.getUser().then(function(u){
    var uid=u&&u.data&&u.data.user&&u.data.user.id;
    if(!uid){throw new Error('계정 정보를 확인할 수 없어요.');}
    return sb.from('users').select('role,status,division_id').eq('auth_uid',uid).limit(1);
  }).then(function(r){
    var row=(r.data||[])[0];
    if(r.error||!row){throw new Error('계정 정보를 확인할 수 없어요.');}
    if(row.status!=='active'||(row.role!=='master'&&row.role!=='group_viewer'&&row.role!=='admin')){
      // 일반 직원은 사업부 앱으로
      location.replace('index.html?app=1');return;
    }
    state.role=row.role; state.myDiv=row.division_id;
    $('login').classList.add('hide');$('app').classList.remove('hide');
    state.month=lastMonths(1)[0];
    return loadDivisions().then(function(){renderGoBar();return load();});
  }).catch(function(e){showLogin((e&&e.message)||'로그인 중 문제가 생겼어요.');});
}
function readShared(){try{var a=JSON.parse(localStorage.getItem('t1_auth')||'null');return a&&a.access_token?a:null;}catch(e){return null;}}
function writeShared(ses){try{localStorage.setItem('t1_auth',JSON.stringify({access_token:ses.access_token,refresh_token:ses.refresh_token,expires_at:ses.expires_at||Math.floor(Date.now()/1000)+3600}));}catch(e){}}
function toLogin(){location.replace('index.html');}
function init(){
  $('loginBtn').onclick=toLogin; $('loginBtn').textContent='로그인 화면으로';
  ['uid','upw'].forEach(function(k){var e=$(k); if(e){e.style.display='none'; if(e.previousElementSibling&&e.previousElementSibling.tagName==='LABEL') e.previousElementSibling.style.display='none';}});
  if(!window.supabase){showLogin('화면을 불러오지 못했어요. 새로고침 해주세요.');return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(function(ev,ses){ if(ses&&(ev==='TOKEN_REFRESHED'||ev==='SIGNED_IN')) writeShared(ses); });
  $('logout').onclick=function(){try{localStorage.removeItem('t1_auth');localStorage.removeItem('t1_me');sessionStorage.removeItem('iaos_app');}catch(e){} toLogin();};
  $('refresh').onclick=load;
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){showTab(b.dataset.t);};});
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-month],[data-kpi],[data-rep],[data-dmove],[data-dmode],[data-dlive]'); if(!t) return;
    if(t.dataset.dmove){dashMove(+t.dataset.dmove);return;}
    if(t.dataset.dmode){DASH.mode=t.dataset.dmode;load();return;}
    if(t.dataset.dlive){var tt=today();DASH.y=tt.y;DASH.m=tt.m;DASH.d=tt.d;load();return;}
    if(t.dataset.month) state.month=t.dataset.month;
    if(t.dataset.kpi) state.kpi=+t.dataset.kpi;
    if(t.dataset.rep) state.repMode=t.dataset.rep;
    load();
  });
  setInterval(function(){if(!document.hidden&&state.tab==='now'&&!$('app').classList.contains('hide'))load();},60000);
  var sh=readShared();
  if(!sh){toLogin();return;}
  sb.auth.setSession({access_token:sh.access_token,refresh_token:sh.refresh_token}).then(function(r){
    if(r.error||!r.data||!r.data.session){toLogin();return;}
    writeShared(r.data.session); enter();
  });
}
init();
})();
</script>
