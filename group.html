<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="group.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="그룹현황">
<title>그룹 통합 현황</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#2B2F36;--mut:#7A8190;--line:#E3E6EB;--soft:#EDEFF2;--sig:#FFE79A;--up:#E2705F;--dn:#2FA67C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 max(24px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 0 0}
.hd .bn{display:flex;align-items:center;gap:10px}
.hd .bn img{width:38px;height:38px;border-radius:50%;box-shadow:0 1px 6px #2b2f3630;flex:none}
.hd h1{font-size:16px;margin:0;font-weight:800}
.hd small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#3da57f;background:#E3F6EE;padding:5px 10px;border-radius:99px;font-weight:700;border:0}
.live i{width:7px;height:7px;border-radius:50%;background:#4BC79B}
.tabs{display:flex;gap:4px;margin:14px 0 0;background:#E6E8EC;border-radius:12px;padding:4px;position:sticky;top:0;z-index:5}
.tabs button{flex:1;padding:9px 0;font-size:13px;color:var(--mut);border:0;background:none;border-radius:9px;font-weight:600}
.tabs button.on{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 4px #2b2f361a}
.pane{display:none;padding-top:12px}.pane.on{display:block}
.card{background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line)}
.card h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.card h3 small{font-weight:500;color:var(--mut);font-size:11px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 0;line-height:1.5}
/* 전광판 */
.board{background:linear-gradient(135deg,#FFF6D2,#FFEFB8);border-radius:18px;padding:13px 14px;margin-bottom:10px;border:1px solid #F5E2A0}
.board .lb{font-size:12px;color:#8a7430;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:700}
.flap{display:flex;gap:6px;align-items:flex-end}
.d{width:50px;height:70px;border-radius:10px;background:linear-gradient(#fffdf2 0 50%,#fff8da 50% 100%);position:relative;display:flex;align-items:center;justify-content:center;font:800 50px/1 ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:#5a4a12;box-shadow:0 2px 0 #e8d68a}
.d:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#f0dfa0}
.unit{font-size:15px;color:#8a7430;margin-left:4px;padding-bottom:6px;font-weight:700}
.share{margin-top:12px;height:14px;border-radius:8px;overflow:hidden;display:flex;gap:2px;background:#fff6}
.share i{display:block;height:100%}
.shl{display:flex;justify-content:space-between;font-size:11px;color:#8a7430;margin-top:5px;font-weight:700;gap:6px}
/* 사업부 비교 */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.cl{border-radius:16px;padding:10px 6px 9px;text-align:center}
.cl .nm{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.cl .nm i{width:8px;height:8px;border-radius:50%;flex:none}
.ring{width:84px;height:84px;margin:6px auto 4px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ring .c span{font-size:10px;color:var(--mut);margin-top:-2px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px}
.mini div{background:#ffffffaa;border-radius:8px;padding:4px 0;font-size:10px;color:var(--mut)}
.mini b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.top{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:#fff;color:#8a6a1f}
/* 근무조별 */
.gc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;height:140px;margin-top:8px}
.gcol{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.gcol div{width:24px;min-height:3px;border-radius:7px 7px 3px 3px;position:relative}
.gcol div b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:12px;font-weight:700;margin-top:6px}
.lg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px;font-weight:600}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
s{text-decoration:none}
/* 현황판 */
.dp{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dp .nv{display:flex;align-items:center;gap:4px}
.dp .nv button{border:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-weight:800;color:var(--mut)}
.dp .nv b{min-width:84px;text-align:center;font-size:13px}
.dp .md{display:flex;background:#E6E8EC;border-radius:99px;padding:2px}
.dp .md button{border:0;background:none;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mut)}
.dp .md button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #2b2f3620}
.kg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.kg div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center}
.kg small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;line-height:1.3;min-height:27px}
.kg b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kg b i{font-style:normal;font-size:11px;color:var(--mut);font-weight:600;margin-left:1px}
.kg .ok b{color:#2FA67C}.kg .wn b{color:#C98A1B}.kg .dg b{color:#D2503F}
.dc{display:block;text-decoration:none;color:inherit;border-radius:16px;padding:11px 12px;margin-bottom:8px}
.dc .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.dc .t span{font-size:11px;color:var(--mut);font-weight:700}
.dc .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.dc .big i{font-style:normal;font-size:12px;color:var(--mut);margin-left:2px}
.dc .big em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700;margin-left:8px}
.dc .m6{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dc .m6 div{background:#ffffffb8;border-radius:9px;padding:4px 0;text-align:center;font-size:10px;color:var(--mut);font-weight:700}
.dc .m6 b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.gl2{padding:5px 0;font-size:13px;display:flex;gap:8px;align-items:center}
.gl2 i{width:9px;height:9px;border-radius:50%;flex:none}
.dl{width:100%;margin-top:6px;padding:11px;border-radius:13px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px}
.hb{display:grid;grid-template-columns:60px 1fr 28px;gap:8px;align-items:center;font-size:12px;margin:6px 0;color:var(--mut);font-weight:700}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .b{height:11px;background:var(--soft);border-radius:7px;overflow:hidden}.hb .b i{display:block;height:100%;border-radius:7px;min-width:2px}
.hb em{font-style:normal;text-align:right;color:var(--ink);font-weight:800}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sc{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.sc.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.sc small{display:block;font-size:11px;color:var(--mut);font-weight:700}
.sc b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:3px 0 2px}
.sc s{text-decoration:none;font-size:11px;font-weight:700}
.sc b i{font-style:normal;font-size:11px;color:var(--mut);font-weight:600;margin-left:2px}
/* 통계 */
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips button{padding:6px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--mut);font-weight:700}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.br{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:12px;margin:7px 0;color:var(--mut);font-weight:700}
.br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .b{height:14px;background:var(--soft);border-radius:8px;overflow:hidden}
.br .b i{display:block;height:100%;border-radius:8px;min-width:2px}
.br em{font-style:normal;text-align:right;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.br em s{text-decoration:none;font-weight:700;font-size:10px;margin-left:4px}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:#9AA0AB}
.gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.g{text-align:center}.g svg{width:100%;height:auto}
.g b{display:block;font-size:17px;margin-top:-22px;font-variant-numeric:tabular-nums;font-weight:800}
.g span{font-size:11px;color:var(--mut);font-weight:700}
.g small{display:block;font-size:10px;color:var(--mut)}
.sp{display:flex;align-items:flex-end;gap:3px;height:30px}.sp i{flex:1;border-radius:3px 3px 1px 1px;min-height:2px}
/* 리포트 */
.hero{background:linear-gradient(135deg,#E9EBEF,#DDE1E6);border-radius:20px;padding:16px;border:1px solid var(--line)}
.hero p{margin:0;font-size:12px;color:var(--mut);font-weight:600}
.hero h2{margin:6px 0 0;font-size:21px;line-height:1.4;letter-spacing:-.4px}
.hero mark{background:linear-gradient(transparent 55%,var(--sig) 55%);color:inherit;padding:0 2px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px}
.kp small{font-size:11px;color:var(--mut);font-weight:600}
.kp b{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:800}
.kp s{text-decoration:none;font-size:11px;font-weight:700}
.pt{display:flex;gap:10px;border-radius:16px;padding:11px 12px;margin-top:8px;font-size:12.5px;line-height:1.45;align-items:center}
.pt .ic{min-width:30px;height:30px;padding:0 6px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
.pt b{display:block;font-size:13px;margin-bottom:1px}
.ex{display:flex;gap:8px;margin-top:12px}
.ex button{flex:1;padding:11px;border-radius:13px;font-size:13px;font-weight:800;background:var(--ink);color:#fff;border:0}
.ex button+button{background:#fff;color:var(--ink);border:1px solid var(--line)}
.note{font-size:11px;color:#9AA0AB;text-align:center;margin-top:10px}
/* 로그인 */
#login{max-width:380px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 20px 20px}
#login .lg1{display:block;width:132px;height:132px;margin:0 auto 18px;border-radius:50%;box-shadow:0 6px 24px #2b2f3626}
#login h1{font-size:20px;margin:0 0 4px;text-align:center}
#login p{margin:0 0 20px;color:var(--mut);font-size:13px;text-align:center}
#login label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:12px 0 5px}
#login input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:#fff;color:var(--ink)}
#login button{width:100%;margin-top:18px;padding:14px;border-radius:13px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:15px}
#login .err{color:var(--up);font-size:13px;margin-top:12px;min-height:18px}
.hide{display:none!important}
.gobar{display:flex;gap:8px;margin:12px 0 0}.gobar a{flex:1;text-align:center;text-decoration:none;padding:11px 4px;border-radius:12px;font-size:13px;font-weight:800;color:#2b3a55;line-height:1.25}.gobar a small{display:block;font-size:10.5px;font-weight:600;opacity:.7}.gobar a.off{opacity:.45;pointer-events:none}
.sm{font-size:12px;color:var(--mut);background:none;border:0;padding:4px}
:focus-visible{outline:3px solid #6FA0EC;outline-offset:2px}
.at-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.at-chip{border:1.5px solid;border-radius:12px;padding:7px 6px;text-align:center;display:flex;flex-direction:column;gap:1px;font:inherit;min-width:0}
.at-chip b{font-size:13px;line-height:1.25;word-break:keep-all}.at-chip span{font-size:11px;font-weight:700;opacity:.85}.at-chip em{font-style:normal;font-size:10px;opacity:.85}
.at-btns{display:flex;flex-wrap:wrap;gap:6px}.at-btns .sp-btn{flex:1 0 28%;padding:9px 6px}
.at-sheet{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.at-sh{background:#fff;border-radius:18px 18px 0 0;padding:16px 14px 20px;width:100%;max-width:560px}.at-sh h3{margin:0 0 10px;font-size:15px}.at-sh h3 small{font-weight:600;color:var(--mut);font-size:11px;margin-left:6px}
.mg-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mg-sum div{border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut);font-weight:700}.mg-sum i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.mg-sum b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}.mg-sum small{font-size:11px;color:var(--mut);font-weight:600}
.ma-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 8px}
.ma-sum div{background:#fff;border-radius:10px;padding:5px 0;text-align:center;font-size:10px;color:var(--mut)}
.ma-sum b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.ma-div{border-radius:14px;padding:10px 11px;margin-bottom:8px}
.ma-div .hdr{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}
.ma-div .hdr small{font-weight:600;color:var(--mut);font-size:11px}
.ma-team{font-size:11px;color:var(--mut);font-weight:700;margin:7px 0 3px}
.ma-chips{display:flex;flex-wrap:wrap;gap:5px}
.ma-chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.ma-chip em{font-style:normal;font-size:10px;color:var(--mut);font-weight:700}
.ma-chip.w{border-color:#9ADBC8;background:#E7F7F1}.ma-chip.e{border-color:#A9C4F2;background:#E8F0FD}.ma-chip.o{border-color:#F6C9A0;background:#FFF1E2}.ma-chip.x{color:#9AA0AB;background:#F3F4F6}
.ma-chip select{border:0;background:transparent;font:inherit;font-size:11px;color:var(--mut);padding:0;max-width:62px}
.ma-more{width:100%;margin-top:6px;border:0;background:#ffffffaa;border-radius:10px;padding:6px;font-size:11px;color:var(--mut);font-weight:700}
.dv-pills{display:flex;gap:6px;margin-bottom:8px;position:sticky;top:48px;z-index:4;background:var(--bg);padding:2px 0}
.dv-pills button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 0;font-size:13px;font-weight:700;color:var(--mut)}
.dv-pills button.on{color:#fff;border-color:transparent}
.dv-dots{display:flex;justify-content:center;gap:5px;margin:2px 0 8px}.dv-dots i{width:6px;height:6px;border-radius:50%;background:#CDD1D9}.dv-dots i.on{background:#6B7280;width:16px;border-radius:4px}
.dv-flr{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}.dv-flr b{min-width:38px}.dv-flr .b{flex:1;height:10px;background:#EDEFF2;border-radius:6px;overflow:hidden}.dv-flr .b i{display:block;height:100%;border-radius:6px}.dv-flr em{font-style:normal;min-width:78px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.dv-flr s{text-decoration:none;font-size:11px;font-weight:700;margin-left:3px}
.dv-tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dv-tg div{background:#F5F6F8;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut);font-weight:700}.dv-tg b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.dv-hz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.dv-hz div{border-radius:14px;padding:10px;text-align:center;font-size:12px;font-weight:700;color:#8A4512;background:#FFF1E3}.dv-hz b{display:block;font-size:22px;color:#5C2D0C}
.tabs button{font-size:12.5px}
.sp-item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:8px}
.sp-item b{font-size:14px}.sp-item small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.sp-ch{display:inline-flex;gap:4px;margin-top:7px;flex-wrap:wrap}.sp-ch span{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#F0F1F4;color:#9AA0AB}.sp-ch span.on{color:#2B2F36}
.sp-tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}.sp-tbl th{font-size:11px;color:var(--mut);font-weight:700;padding:6px 3px;border-bottom:1px solid var(--line);text-align:right}.sp-tbl th:first-child,.sp-tbl td:first-child{text-align:left}.sp-tbl td{padding:6px 3px;border-bottom:1px solid #F0F1F4;text-align:right}.sp-tbl tr.tot td{font-weight:800;background:#FAFAFB}.sp-tbl td.sm{font-weight:800}
.ck-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ck{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:800;background:#fff}.ck input{width:18px;height:18px}
.sp-in{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:14px;margin-bottom:8px;background:#fff}
.sp-btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;background:#2B2F36;color:#fff}.sp-btn.g{background:#E6E8EC;color:var(--ink)}.sp-btn.r{background:#FDE9ED;color:#C0485F}
.tabs button{font-size:12px}
.cl-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cl-nav b{font-size:15px}.cl-nav button{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:32px}
.cl-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.cl-chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--mut)}.cl-chips button.on{color:#fff;border-color:transparent}
.cl-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px}
.cl-w{text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;padding:3px 0}.cl-d{min-height:50px;border-radius:9px;padding:3px 2px;text-align:center;font-size:12px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px}

<script>
(function(){
'use strict';
var sb = null;
var PALETTE = ['#4DBDB2','#6FA0EC','#E3A04C','#B69AE8','#E58FA8','#7DC7D6'];      // 사업부 색 (파스텔)
var SOFT    = ['#DDF3F1','#E4EDFC','#FBEBD2','#EDE5FA','#FBE3EA','#DDF1F5'];
var SHIFTS  = ['오전','오후','야간'];
var divs = [];            // [{id,name,short,color,soft}]
var state = {tab:'now', month:null, kpi:1, repMode:'month'};
var cache = {};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n0(v){return Math.round(Number(v)||0).toLocaleString('ko-KR');}
function pad(n){return (n<10?'0':'')+n;}

/* ---------- 날짜 (한국 시간 기준) ---------- */
function kstParts(d){
  var f = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d||new Date());
  var o={}; f.forEach(function(p){o[p.type]=p.value;}); return {y:+o.y||+o.year,m:+o.month,d:+o.day,hh:o.hour==='24'?'00':o.hour,mm:o.minute};
}
function ymd(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function daysIn(y,m){return new Date(y,m,0).getDate();}
function today(){var p=kstParts();return {y:p.y,m:p.m,d:p.d};}
function monthRange(ym){
  var y=+ym.slice(0,4), m=+ym.slice(5,7), t=today(), cur=(t.y===y&&t.m===m);
  var toD = cur ? t.d : daysIn(y,m);
  var py=m===1?y-1:y, pm=m===1?12:m-1, pTo=Math.min(toD, daysIn(py,pm));
  return {from:ymd(y,m,1), to:ymd(y,m,toD), pFrom:ymd(py,pm,1), pTo:ymd(py,pm,pTo), label:y+'년 '+m+'월', span:(cur?('1일~'+toD+'일'):'')};
}
function yearRange(y){
  var t=today(), cur=(t.y===y), toM=cur?t.m:12, toD=cur?t.d:31;
  return {from:ymd(y,1,1), to:ymd(y,toM,toD), pFrom:ymd(y-1,1,1), pTo:ymd(y-1,toM,Math.min(toD,daysIn(y-1,toM))), label:y+'년', span:cur?('1월~'+toM+'월'):''};
}
function lastMonths(n){var t=today(),a=[],y=t.y,m=t.m;for(var i=0;i<n;i++){a.push(y+'-'+pad(m));m--;if(m===0){m=12;y--;}}return a;}

/* ---------- 데이터 ---------- */
function rpc(name,args){
  return sb.rpc(name,args||{}).then(function(r){ if(r.error) throw r.error; return r.data||[]; });
}
function loadDivisions(){
  return sb.from('divisions').select('id,name,sort_order,active').neq('id','ALL').eq('active',true).order('sort_order').then(function(r){
    if(r.error) throw r.error;
    divs = (r.data||[]).map(function(d,i){
      return {id:d.id,name:d.name,short:d.name.replace(/환경미화사업부$/,'').replace(/사업부$/,'')||d.id,color:PALETTE[i%PALETTE.length],soft:SOFT[i%SOFT.length]};
    });
  });
}
function renderGoBar(){
  var h='';
  divs.forEach(function(d){
    var ok=(state.role==='master'||state.role==='group_viewer'||d.id===state.myDiv);
    h+='<a class="'+(ok?'':'off')+'" style="background:'+d.soft+'" href="index.html?app=1&div='+encodeURIComponent(d.id)+'">'+d.short+'<small>'+(ok?'앱 열기 ›':'내 사업부 아님')+'</small></a>';
  });
  $('goBar').innerHTML=h;
}
function byDiv(rows,key){var o={};rows.forEach(function(r){(o[r.division_id]=o[r.division_id]||[]).push(r);});return o;}

/* ---------- 도형 ---------- */
function ringSvg(vals,color){
  var r=33,C=2*Math.PI*r,t=vals.reduce(function(a,b){return a+b;},0),off=0,op=[1,.68,.38];
  var s='<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="#ffffffb0" stroke-width="9"/>';
  if(t>0) vals.forEach(function(x,i){var len=Math.max(0,x/t*C-3);
    s+='<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+color+'" stroke-opacity="'+op[i]+'" stroke-width="9" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>'; off+=x/t*C;});
  return '<svg viewBox="0 0 84 84" aria-hidden="true">'+s+'</svg>';
}
function gaugeSvg(pct,color){
  var r=36,L=Math.PI*r,f=Math.max(0,Math.min(pct,100))/100*L;
  return '<svg viewBox="0 0 100 58" aria-hidden="true"><path d="M14 52 A36 36 0 0 1 86 52" fill="none" stroke="#E6E8EC" stroke-width="10" stroke-linecap="round"/><path d="M14 52 A36 36 0 0 1 86 52" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+f+' '+L+'"/></svg>';
}
// 색 규칙: 적을수록 좋은 항목(민원·안전사고·폐기물)만 늘면 빨강/줄면 초록, 나머지는 방향만 회색으로 표시
var GOOD_LOW={voc:1,accident:1,waste_kg:1};
function delta(cur,prev,key){
  if(!prev) return cur? '<s class="fl">신규</s>' : '<s class="fl">–</s>';
  var p=Math.round((cur-prev)/prev*100);
  if(p===0) return '<s class="fl">–</s>';
  var cls=GOOD_LOW[key]?(p>0?'up':'dn'):'fl';
  return '<s class="'+cls+'">'+(p>0?'▲':'▼')+Math.abs(p)+'%</s>';
}

/* ---------- 현황판 탭 ---------- */
var DASH={mode:'day',y:0,m:0,d:0,last:null};
function dashInit(){var t=today(); if(!DASH.y){DASH.y=t.y;DASH.m=t.m;DASH.d=t.d;}}
function dashRange(){
  dashInit(); var t=today(), tStr=ymd(t.y,t.m,t.d), from,to,label;
  if(DASH.mode==='day'){from=to=ymd(DASH.y,DASH.m,DASH.d); label=(from===tStr)?'오늘':from;}
  else if(DASH.mode==='month'){from=ymd(DASH.y,DASH.m,1); to=ymd(DASH.y,DASH.m,daysIn(DASH.y,DASH.m)); if(to>tStr)to=tStr; label=(DASH.y===t.y&&DASH.m===t.m)?'이번 달':(DASH.y+'년 '+DASH.m+'월');}
  else {from=ymd(DASH.y,1,1); to=ymd(DASH.y,12,31); if(to>tStr)to=tStr; label=(DASH.y===t.y)?'올해':(DASH.y+'년');}
  return {from:from,to:to,label:label,isToday:(DASH.mode==='day'&&from===tStr),avg:DASH.mode!=='day'};
}
function dashMove(n){
  var t=today();
  if(DASH.mode==='day'){var x=new Date(Date.UTC(DASH.y,DASH.m-1,DASH.d+n)); DASH.y=x.getUTCFullYear();DASH.m=x.getUTCMonth()+1;DASH.d=x.getUTCDate();}
  else if(DASH.mode==='month'){DASH.m+=n; if(DASH.m<1){DASH.m=12;DASH.y--;} if(DASH.m>12){DASH.m=1;DASH.y++;}}
  else DASH.y+=n;
  if(ymd(DASH.y,DASH.mode==='year'?1:DASH.m,DASH.mode==='day'?DASH.d:1)>ymd(t.y,t.m,t.d)){DASH.y=t.y;DASH.m=t.m;DASH.d=t.d;}
  load();
}
function dashCalc(rows,rg){
  var R={}; rows.forEach(function(r){var o=(R[r.division_id]=R[r.division_id]||{}); (o[r.metric]=o[r.metric]||{})[r.k]=Number(r.v)||0;});
  var out={};
  divs.forEach(function(d){
    var o=R[d.id]||{}, g=function(m,k){return (o[m]&&o[m][k])||0;};
    var days=Math.max(g('days',''),1), f=rg.avg?function(v){return Math.round(v/days);}:function(v){return Math.round(v);};
    var sh={'오전':f(g('shift','오전')),'오후':f(g('shift','오후')),'야간':f(g('shift','야간')),'관리자':f(g('shift','관리자'))};
    var staff=sh['오전']+sh['오후']+sh['야간']+sh['관리자'], quota=g('quota','total');
    var hoT=g('ho','total'), hoC=g('ho','confirmed'), vT=g('voc','total'), vD=g('voc','done'), lT=g('lost','total'), lD=g('lost','done');
    out[d.id]={sh:sh,staff:staff,quota:quota,rate:quota?Math.round(staff/quota*100):null,
      hoT:hoT,hoC:hoC,hoRate:hoT?Math.round(hoC/hoT*100):100,vT:vT,vRate:vT?Math.round(vD/vT*100):100,lT:lT,lRate:lT?Math.round(lD/lT*100):100,
      acc:g('acc','total'),ev:g('ho','event'),jwN:g('jw','count'),jwP:g('jw','people'),
      fac:o.fac||{},vcat:o.voc_cat||{},atype:o.acc_type||{}};
  });
  return out;
}
function sumObj(out,key){var t={};divs.forEach(function(d){var o=out[d.id][key];Object.keys(o).forEach(function(k){t[k]=(t[k]||0)+o[k];});});return t;}
function hbars(obj,color,empty){
  var ks=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}).slice(0,5);
  if(!ks.length) return '<div class="empty" style="padding:8px 0">'+empty+'</div>';
  var mx=obj[ks[0]];
  return ks.map(function(k){return '<div class="hb"><span>'+esc(k)+'</span><div class="b"><i style="width:'+(obj[k]/mx*100)+'%;background:'+color+'"></i></div><em>'+n0(obj[k])+'</em></div>';}).join('');
}
function kcell(label,val,unit,lv){return '<div class="'+(lv||'')+'"><small>'+label+'</small><b>'+val+'<i>'+unit+'</i></b></div>';}
function renderNow(rows){
  var el=$('p-now'), rg=dashRange();
  if(!divs.length){el.innerHTML='<div class="card empty">등록된 사업부가 없어요.<br>사업부 관리에서 사업부를 먼저 추가하세요.</div>';return;}
  var o=dashCalc(rows,rg); DASH.last={rg:rg,o:o};
  var sum=function(k){return divs.reduce(function(a,d){return a+(o[d.id][k]||0);},0);};
  var staff=sum('staff'), quota=sum('quota'), hoT=sum('hoT'), hoC=sum('hoC'), vT=sum('vT'), acc=sum('acc');
  var staffQ=divs.reduce(function(a,d){return a+(o[d.id].quota?o[d.id].staff:0);},0), rate=quota?Math.round(staffQ/quota*100):null, hoRate=hoT?Math.round(hoC/hoT*100):100;
  var pl=rg.label+(rg.avg?' 일평균':'');
  var nav='<div class="dp"><div class="nv"><button type="button" data-dmove="-1" aria-label="이전">◀</button><b>'+esc(rg.label)+'</b><button type="button" data-dmove="1" aria-label="다음">▶</button>'
    +(rg.isToday?'':'<button type="button" data-dlive="1">오늘</button>')+'</div>'
    +'<div class="md">'+[['day','일간'],['month','월간'],['year','연간']].map(function(x){return '<button type="button" data-dmode="'+x[0]+'" class="'+(DASH.mode===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  var kpi='<div class="kg">'
    +kcell(pl+' 근무인원',n0(staff),'명')
    +kcell('근무율 (정원 대비)',rate==null?'–':rate,rate==null?'':'%',rate==null?'':(rate>=80?'ok':(rate>=60?'wn':'dg')))
    +kcell('인수인계 완료율',hoRate,'%',hoRate>=90?'ok':(hoRate>=70?'wn':'dg'))
    +kcell('민원 접수',n0(vT),'건')
    +kcell('안전사고',n0(acc),'건',acc===0?'ok':'dg')
    +kcell('미확인 인수인계',n0(hoT-hoC),'건',(hoT-hoC)===0?'ok':'wn')+'</div>';
  var today1='';
  if(rg.isToday){
    today1='<div class="card"><h3>오늘 한눈에 보기</h3>'+divs.map(function(d){
      var x=o[d.id], a=x.staff>0, b=(x.hoT-x.hoC)===0;
      return '<div class="gl2"><i style="background:'+d.color+'"></i><b style="min-width:62px">'+esc(d.short)+'</b><span>'+(a?'🟢 인력현황 입력':'🟡 인력현황 미입력')+'</span><span>'+(b?'🟢 인계 확인 완료':'🟡 미확인 인계 '+(x.hoT-x.hoC)+'건')+'</span></div>';
    }).join('')+'</div>';
  }
  var cards=divs.map(function(d){
    var x=o[d.id], ok=(state.role==='master'||state.role==='group_viewer'||d.id===state.myDiv);
    return '<a class="dc" style="background:'+d.soft+'" href="index.html?app=1&div='+encodeURIComponent(d.id)+'"><div class="t"><span style="color:var(--ink)"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+d.color+';margin-right:6px"></i>'+esc(d.name)+'</span><span>'+(ok?'상세 ›':'')+'</span></div>'
      +'<div class="big">'+n0(x.staff)+'<i>명</i><em>'+(x.rate==null?'정원 미등록':('근무율 '+x.rate+'%'))+'</em></div>'
      +'<div class="m6"><div>오전<b>'+n0(x.sh['오전'])+'</b></div><div>오후<b>'+n0(x.sh['오후'])+'</b></div><div>야간<b>'+n0(x.sh['야간'])+'</b></div>'
      +'<div>인수인계<b>'+x.hoRate+'%</b></div><div>민원처리<b>'+x.vRate+'%</b></div><div>유실물<b>'+x.lRate+'%</b></div>'
      +'<div>안전사고<b>'+n0(x.acc)+'</b></div><div>공동작업<b>'+n0(x.jwN)+'</b></div><div>고장신고<b>'+n0(x.ev)+'</b></div></div></a>';
  }).join('');
  var shT=['오전','오후','야간'].map(function(s){return divs.reduce(function(a,d){return a+o[d.id].sh[s];},0);});
  var shMax=Math.max.apply(null,shT.concat([1]));
  var shBars=['오전','오후','야간'].map(function(s,i){return '<div class="hb"><span>'+s+'</span><div class="b"><i style="width:'+(shT[i]/shMax*100)+'%;background:#6FA0EC"></i></div><em>'+n0(shT[i])+'</em></div>';}).join('');
  var ana='<div class="card"><h3>현황 분석 <small>'+esc(pl)+' · 전 사업부 합산</small></h3>'
    +'<div style="font-size:12px;font-weight:800;margin:4px 0">시간대별 현장 인원</div>'+shBars

  if(it.att&&it.att.checked) return {st:it.att.status||'출근',src:'rec'};

  if(l) return {st:l.status,src:'plan'};
  if(it.div==='ALL'){
    var o=(B.off||[]).filter(function(x){return x.name===it.key;})[0];
    if(o&&(!o.apply_from||String(o.apply_from).slice(0,10)<=ds)){var wd=new Date(ds+'T00:00:00Z').getUTCDay(); if(o.off_day1===wd||o.off_day2===wd) return {st:'휴무',src:'off'};}
  }

}
function atBuild(B,ds){
  var out={};
  function put(div,team,key,person,role,att){
    var o=out[div]=out[div]||{}, t=o[team]=o[team]||{}; 
    if(!t[key]) t[key]={div:div,team:team,key:key,person:person,role:role,att:att||null};
    else{ if(att) t[key].att=att; if(person&&!t[key].person) t[key].person=person; }
  }
  (B.people||[]).forEach(function(p){var s=atSlot(p); put(p.division_id,s[0],s[1],p.name,p.role,null);});
  (B.att||[]).forEach(function(a){ put(a.division_id,a.team,a.name,null,a.role,a); });
  var res={};
  Object.keys(out).forEach(function(div){
    res[div]=Object.keys(out[div]).sort(function(a,b){return atTeamOrd(a)-atTeamOrd(b)||(a<b?-1:1);}).map(function(team){
      var items=Object.keys(out[div][team]).map(function(k){var it=out[div][team][k];it.eff=atEff(it,B,ds);return it;})
        .sort(function(a,b){return atSlotOrd(a.key)-atSlotOrd(b.key)||(a.key<b.key?-1:1);});
      return {team:team,items:items};
    });
  });

function lbToken(){return sb.auth.getSession().then(function(r){return r&&r.data&&r.data.session?r.data.session.access_token:SUPABASE_ANON_KEY;});}
function lbOpen(bucket,path,win){
  return lbToken().then(function(tk){
    return fetch(SUPABASE_URL+'/storage/v1/object/'+bucket+'/'+String(path).split('/').map(encodeURIComponent).join('/'),{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+tk}});
  }).then(function(r){ if(!r.ok) throw new Error('파일을 열 수 없어요 ('+r.status+')'); return r.blob(); })
  .then(function(b){ var u=URL.createObjectURL(b); if(win&&!win.closed) win.location.href=u; else window.open(u,'_blank'); })
  .catch(function(e){ if(win&&!win.closed) win.close(); alert((e&&e.message)||'파일을 열 수 없어요.'); });

function lbLoadCat(c){

function rankMap(rows){

    var v=Number(r.v)||0; if(!(v>0)) return;

    if(/_team$/.test(r.metric)&&d) key=d.short+' '+r.k;

  });

}
function rankHtml(id,rk){

function loadStats(){
  var rg=state.repMode==='year'&&state.tab==='rep'?yearRange(+state.month.slice(0,4)):monthRange(state.month);

    rpc('group_stats',{p_from:rg.from,p_to:rg.to,p_prev_from:rg.pFrom,p_prev_to:rg.pTo}),
    rpc('group_kpi',{p_year:yr}), rpc('group_kpi_targets',{p_year:yr}), rpc('group_daily_intake',{p_days:7})

function load(){
  stamp();

    $('p-'+state.tab).innerHTML='<div class="card empty">데이터를 불러오지 못했어요.<br>'+esc(msg)+'<br>잠시 후 새로고침을 눌러 주세요.</div>';

function showTab(t){

  load();

/* ---------- 로그인 / 권한 ---------- */
function toEmail(id){id=String(id||'').trim();return id.indexOf('@')>=0?id:id+'@iaosdops.internal';}
function showLogin(msg){$('app').classList.add('hide');$('login').classList.remove('hide');$('loginErr').textContent=msg||'';}
function enter(){
  return sb.auth.getUser().then(function(u){
    var uid=u&&u.data&&u.data.user&&u.data.user.id;
    if(!uid){throw new Error('계정 정보를 확인할 수 없어요.');}
    return sb.from('users').select('role,status,division_id,name').eq('auth_uid',uid).limit(1);
  }).then(function(r){
    var row=(r.data||[])[0];
    if(r.error||!row){throw new Error('계정 정보를 확인할 수 없어요.');}
    if(row.status!=='active'||(row.role!=='master'&&row.role!=='group_viewer'&&row.role!=='admin')){
      // 일반 직원은 사업부 앱으로
      location.replace('index.html?app=1');return;
    }
    state.role=row.role; state.myDiv=row.division_id; state.myName=row.name;
    $('login').classList.add('hide');$('app').classList.remove('hide');
    state.month=lastMonths(1)[0];
    return loadDivisions().then(function(){renderGoBar();return load();});
  }).catch(function(e){showLogin((e&&e.message)||'로그인 중 문제가 생겼어요.');});
}
function readShared(){try{var a=JSON.parse(localStorage.getItem('t1_auth')||'null');return a&&a.access_token?a:null;}catch(e){return null;}}
function writeShared(ses){try{localStorage.setItem('t1_auth',JSON.stringify({access_token:ses.access_token,refresh_token:ses.refresh_token,expires_at:ses.expires_at||Math.floor(Date.now()/1000)+3600}));}catch(e){}}
function toLogin(){location.replace('index.html');}
function init(){
  $('loginBtn').onclick=toLogin; $('loginBtn').textContent='로그인 화면으로';
  ['uid','upw'].forEach(function(k){var e=$(k); if(e){e.style.display='none'; if(e.previousElementSibling&&e.previousElementSibling.tagName==='LABEL') e.previousElementSibling.style.display='none';}});
  if(!window.supabase){showLogin('화면을 불러오지 못했어요. 새로고침 해주세요.');return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(function(ev,ses){ if(ses&&(ev==='TOKEN_REFRESHED'||ev==='SIGNED_IN')) writeShared(ses); });
  $('logout').onclick=function(){try{localStorage.removeItem('t1_auth');localStorage.removeItem('t1_me');sessionStorage.removeItem('iaos_app');}catch(e){} toLogin();};
  $('refresh').onclick=load;
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){showTab(b.dataset.t);};});
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='lbQ'){LB.q=e.target.value;LB._focus=true;lbRender();}});
  document.addEventListener('click',function(e){
    var lbt=e.target.closest('[data-lbcat],[data-lbfile],[data-lbpost],[data-lbimg]');
    if(lbt){var z=lbt.dataset;
      if(z.lbcat){LB.cat=z.lbcat;LB.q='';LB._focus=false;LB.openP=null;loadLb();}
      else if(z.lbpost){LB.openP=(LB.openP===z.lbpost?null:z.lbpost);lbRender();}
      else if(z.lbfile){var w=window.open('','_blank'); lbOpen(lbCur().bucket,z.lbfile,w);}
      else if(z.lbimg){var w2=window.open('','_blank'); lbOpen('companynews',z.lbimg,w2);}
      return;}
    var sc=e.target.closest('[data-scsub],[data-scmove],[data-scflt],[data-scday],[data-scnew],[data-scedit],[data-scback],[data-scsave],[data-scdel],[data-scmt],[data-scwk]');
    if(sc){var q=sc.dataset;
      if(q.scsub){SC.sub=q.scsub;loadSc();}
      else if(q.scmove){SC.m+=+q.scmove; if(SC.m<1){SC.m=12;SC.y--;} if(SC.m>12){SC.m=1;SC.y++;} SC.sel=ymd(SC.y,SC.m,1); loadSc();}
      else if(q.scflt){SC.flt[q.scflt]=!SC.flt[q.scflt]; renderSc();}
      else if(q.scday){SC.sel=q.scday; renderSc();}
      else if(q.scnew){SC.ed={id:null,kind:'교육',title:'',start:SC.sel,end:SC.sel,place:'',memo:'',share:divs.map(function(d){return d.id;})};SC.sub='form';renderSc();}
      else if(q.scedit){var it=SC.items.filter(function(x){return x.id===q.scedit;})[0]; if(it){SC.ed={id:it.id,kind:it.kind,title:it.title,start:String(it.start_date).slice(0,10),end:String(it.end_date).slice(0,10),place:it.place||'',memo:it.memo||'',share:it.share||[]};SC.sub='form';renderSc();}}
      else if(q.scback){SC.sub='cal';renderSc();}
      else if(q.scsave){scSave();}
      else if(q.scdel){ if(confirm('이 그룹 일정을 삭제할까요?')) rpc('group_schedule_delete',{p_id:q.scdel}).then(function(){SC.sub='cal';return loadSc();}).catch(function(err){alert('삭제하지 못했어요: '+((err&&err.message)||''));}); }
      else if(q.scmt){SC.mtDiv=q.scmt;renderSc();}
      else if(q.scwk){SC.openW=(SC.openW===q.scwk?null:q.scwk);renderSc();}
      return;}
    var sp=e.target.closest('[data-spnew],[data-spopen],[data-spback],[data-spedit],[data-spsave],[data-spdel]');
    if(sp){var dd=sp.dataset;
      if(dd.spnew){spStartEdit(null);} else if(dd.spopen){spOpen(dd.spopen);} else if(dd.spback){SP.view=(SP.view==='edit'&&SP.detail&&SP.ed&&SP.ed.id)?'detail':'list';renderSp();}
      else if(dd.spedit){var g=SP.list.filter(function(x){return x.id===dd.spedit;})[0]||SP.detail; spStartEdit(g);} else if(dd.spsave){spSave();} else if(dd.spdel){spDelete(dd.spdel);}
      return;}
    var rp=e.target.closest('[data-rpage],[data-rback],[data-rrf],[data-rmore]');
    if(rp){ if(rp.dataset.rpage){repOpen(rp.dataset.rpage);} else if(rp.dataset.rback){repBack();} else if(rp.dataset.rrf){REP.rf=rp.dataset.rrf;REP.rn=30;renderRep(REP.data);} else if(rp.dataset.rmore){REP.rn+=50;renderRep(REP.data);} return; }
    var dvb=e.target.closest('[data-dvidx]'); if(dvb){dvGo(+dvb.dataset.dvidx);return;}
    var at=e.target.closest('[data-atmove],[data-atpick],[data-atclose],[data-athist],[data-atset],[data-atme],[data-atback],[data-athmode],[data-athmove],[data-atleave],[data-atlsave],[data-atldel],[data-atosave],[data-goat]');
    if(at){ if(at.classList.contains('at-sheet')&&e.target!==at) return; atAct(at.dataset); return; }
    var t=e.target.closest('[data-month],[data-kpi],[data-rep],[data-dmove],[data-dmode],[data-dlive],[data-smove],[data-smode],[data-sopen],[data-rmove],[data-rmode],[data-rsub],[data-ritem]'); if(!t) return;
    if(t.dataset.rmove){repMove(+t.dataset.rmove);return;}
    if(t.dataset.rmode){REP.mode=t.dataset.rmode;load();return;}
    if(t.dataset.smove){statMove(+t.dataset.smove);return;}
    if(t.dataset.smode){STAT.mode=t.dataset.smode;load();return;}
    if(t.dataset.sopen){STAT.open=(STAT.open===t.dataset.sopen?null:t.dataset.sopen);if(STAT.data){renderStat(STAT.data);}return;}
    if(t.dataset.dmove){dashMove(+t.dataset.dmove);return;}
    if(t.dataset.dmode){DASH.mode=t.dataset.dmode;load();return;}
    if(t.dataset.dlive){var tt=today();DASH.y=tt.y;DASH.m=tt.m;DASH.d=tt.d;load();return;}
    if(t.dataset.month) state.month=t.dataset.month;
    if(t.dataset.kpi) state.kpi=+t.dataset.kpi;
    if(t.dataset.rep) state.repMode=t.dataset.rep;
    load();
  });
  setInterval(function(){if(!document.hidden&&state.tab==='now'&&!$('app').classList.contains('hide'))load();},60000);
  var sh=readShared();
  if(!sh){toLogin();return;}
  sb.auth.setSession({access_token:sh.access_token,refresh_token:sh.refresh_token}).then(function(r){
    if(r.error||!r.data||!r.data.session){toLogin();return;}
    writeShared(r.data.session); enter();
  });
}
init();
})();
</script>
</body>
</html>
