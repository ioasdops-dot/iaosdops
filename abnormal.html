function erpDateStr(v){if(v==null)return '';if(typeof v==='number'){return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);}
  if(v instanceof Date)return v.toISOString().slice(0,10);var m=String(v).match(/(\d{4})[-./]\s*(\d{1,2})[-./]\s*(\d{1,2})/);return m?m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2):'';}

    var wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});

function tpClose(){TP.open=false;render();}
async function tpCompute(){
  TP.busy=true;render();
  try{
    var rows=mpPivot(await getAll('/mp_cells?select=*&work_date=eq.'+S.date));
    var lg=await getJ('/ab_tops_sync_log?select=id,created_at,created_by,undone&work_date=eq.'+S.date+'&order=id.desc&limit=1').catch(function(){return [];});
    TP.last=lg&&lg[0]&&!lg[0].undone?lg[0]:null;
    var byTc={};rows.forEach(function(r){byTc[r.team_code]=r;});
    var cnt={},supN=0;
    Object.keys(S.checkin).forEach(function(id){var c=S.checkin[id];if(!c||!c.zone_key)return;
      if(c.support_from){supN++;return;}
      var m=String(c.zone_key).match(/^(ls|as)_(east|west)_(toilet|both|common|collect)_(b2|b1|1|2|3|4)f$/);if(!m)return;
      var tc=String(c.zone_team||'');if(!/^\d+팀[A-C]$/.test(tc))return;
      var pf=m[1]+'_'+m[2],fl=m[4]+'f';var o=cnt[tc]=cnt[tc]||{};o[pf+'|'+m[3]+'|'+fl]=(o[pf+'|'+m[3]+'|'+fl]||0)+1;});
    var items=[],skipped=[],same=0,diffCells=0;
    Object.keys(cnt).sort().forEach(function(tc){
      var row=byTc[tc];if(!row){skipped.push(tc);return;}
      var ov=tpMat(row.values),nv=tpMat(row.values),cols={},lines=[],colDiff=false;
      TP_PFX.forEach(function(pf,ri){TP_FL.forEach(function(fl,fi){
        var tot=0,kd={};TP_KD.forEach(function(k){var n=cnt[tc][pf+'|'+k+'|'+fl]||0;kd[k]=n;tot+=n;var key=pf+'_'+k+'_'+fl;cols[key]=n;if((row[key]||0)!==n)colDiff=true;});
        nv[ri][fi]=tot;
        var o=ov[ri][fi];if(o===0&&tot===0)return;
        var ch=o!==tot;if(ch)diffCells++;else same++;
        lines.push({label:TP_AREA[pf]+' '+TP_FLN[fi],old:o,nw:tot,ch:ch,kd:kd});});});
      var valDiff=JSON.stringify(ov)!==JSON.stringify(tpMat(nv))||false;
      var changed=lines.some(function(l){return l.ch;})||colDiff;
      items.push({tc:tc,shift:row.shift,lines:lines,changed:changed,send:{shift:row.shift,team_code:tc,values:nv,cols:cols,expect_values:row.values}});});
    TP.calc={items:items,skipped:skipped,same:same,diffCells:diffCells,supN:supN};
  }catch(e){TP.calc={err:e.message};}
  TP.busy=false;render();
}

function aplPri(k){var m=String(k).match(/^(ls|as)_(east|west)_(toilet|both|common)_(\w+)$/);if(!m)return false;return m[1]==='ls'?['b1f','1f','3f'].indexOf(m[4])>=0:m[4]==='3f';}
function aplSpread(m,ks,w,room,res){var g=0;
  while(m>0&&g++<60){var act=ks.filter(function(k){return room==null||room[k]>0;});if(!act.length)break;
    var tw=act.reduce(function(s,k){return s+(w[k]>0?w[k]:.01);},0),give={},used=0,fr=[];
    act.forEach(function(k){var q=m*(w[k]>0?w[k]:.01)/tw,f=Math.floor(q);if(room)f=Math.min(f,room[k]);give[k]=f;used+=f;fr.push([k,q-Math.floor(q)]);});
    fr.sort(function(a,b){return b[1]-a[1]||(w[b[0]]||0)-(w[a[0]]||0);});
    var left=m-used;for(var i=0;i<fr.length&&left>0;i++){var k=fr[i][0];if(room&&give[k]>=room[k])continue;give[k]++;left--;}
    var any=0;act.forEach(function(k){if(give[k]>0){res[k]=(res[k]||0)+give[k];if(room)room[k]-=give[k];any+=give[k];}});
    m-=any;if(!any)break;}
  return m;}
function aplAlloc(n,keys,cur){var res={},w={},rp={},ro={},pri=keys.filter(aplPri),oth=keys.filter(function(k){return !aplPri(k);});
  keys.forEach(function(k){res[k]=0;w[k]=S.avg[k]||0;var nd=Math.max(0,Math.round(w[k])-(cur[k]||0));if(aplPri(k))rp[k]=nd;else ro[k]=nd;});
  var m=n;m=aplSpread(m,pri,w,rp,res);m=aplSpread(m,oth,w,ro,res);
  if(m>0)aplSpread(m,keys,w,null,res);return res;}
function aplPlan(t){var plan=[];
  ['A','B','C'].forEach(function(L){var tc=t+L,g=S.grp[tc];if(!g||!g.roster.length)return;
    if(S.closed[tc]){plan.push({tc:tc,L:L,skip:'마감됨'});return;}
    var people=g.roster.filter(function(e){var id=e.emp_no;return !S.checkin[id]&&!S.ck.pend[id]&&!S.off[id]&&!(S.wlAbs[id]&&!erpOk(id))&&(S.erpN>0?!!S.erp[id]:true);}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ko');});
    var ns=nsTeam(tc),keys=ns?nsOrder(tc).filter(function(k){return ((S.nsT||{})[tc]||{})[k]>0;}):ownZones([tc]);if(!keys||!keys.length){plan.push({tc:tc,L:L,skip:ns?'DopS 야간 입력 없음':'담당 구역 기록 없음'});return;}
    if(!people.length){plan.push({tc:tc,L:L,skip:'배치할 인원 없음'});return;}
    var cur={};g.roster.forEach(function(e){var ci=S.checkin[e.emp_no];if(ci&&ci.zone_key&&!ci.support_from)cur[ci.zone_key]=(cur[ci.zone_key]||0)+1;});
    var res,ord;
    if(ns){var tv=S.nsT[tc],room={};keys.forEach(function(k){room[k]=Math.max(0,tv[k]-(cur[k]||0));});res={};keys.forEach(function(k){res[k]=0;});var mm=aplSpread(people.length,keys,tv,room,res);if(mm>0)aplSpread(mm,keys,tv,null,res);ord=keys.filter(function(k){return res[k]>0;});}
    else{res=aplAlloc(people.length,keys,cur);ord=keys.filter(function(k){return res[k]>0;}).sort(function(a,b){return (aplPri(b)-aplPri(a))||((S.avg[b]||0)-(S.avg[a]||0));});}
    var i=0,items=[];
    ord.forEach(function(k){items.push({k:k,cnt:res[k],pri:aplPri(k),ids:people.slice(i,i+res[k]).map(function(e){return e.emp_no;}),avg:ns?(S.nsT[tc][k]||0):Math.round(S.avg[k]||0),ns:ns});i+=res[k];});
    plan.push({tc:tc,L:L,n:people.length,items:items});});
  return plan;}

function normUnion(v){var s=String(v==null?'':v).replace(/\s/g,'');if(!s)return '';if(/민노|민주|KCTU|운영통합|지회/i.test(s))return '민노';if(/한마음|한노|한국노총|FKTU/i.test(s))return '한마음';if(/비노조|비조합|무소속|미가입|없음|^비$/.test(s))return '비노조';if(/^민/.test(s))return '민노';if(/^한/.test(s))return '한마음';if(/^비/.test(s))return '비노조';return '';}
function unionView(){

function uplFile(f){if(!f)return;var rd=new FileReader();rd.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    var hi=-1,ci=-1,ui=-1;for(var i=0;i<Math.min(a.length,15)&&hi<0;i++){a[i].forEach(function(c,j){var s=String(c).replace(/\s/g,'');if(ci<0&&/사번|사원번호/.test(s))ci=j;});if(ci>=0){hi=i;a[i].forEach(function(c,j){var s=String(c).replace(/\s/g,'');if(ui<0&&/노조|조합|소속|구분/.test(s)&&j!==ci)ui=j;});}}
    if(hi<0||ui<0){toast('사번·노조 열을 찾지 못했습니다');return;}
    var seen={},rows=[],dup=0,unk=0,okN=0,failList=[],cnt={},total=0;
    for(var r=hi+1;r<a.length;r++){var no=String(a[r][ci]).trim().replace(/\.0$/,'');if(!no)continue;total++;var un=normUnion(a[r][ui]);if(!un){unk++;continue;}if(seen[no]){dup++;continue;}seen[no]=1;rows.push({emp_no:no,union_name:un});if(S.byNo[no]){okN++;cnt[un]=(cnt[un]||0)+1;}else failList.push(no);}
    S.upl={name:f.name,rows:total,ok:okN,fail:failList.length,dup:dup,unk:unk,cnt:cnt,failList:failList,data:rows};render();
  }catch(e){toast('파일을 읽지 못했습니다: '+e.message);}};rd.readAsArrayBuffer(f);}
